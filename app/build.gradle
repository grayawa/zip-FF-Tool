plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grayawa.zipff'
    compileSdk 37

    defaultConfig {
        applicationId "com.grayawa.zipff"
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName "2.0"
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
}
