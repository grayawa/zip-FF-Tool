plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grayawa.zipff'
    compileSdk 34

    defaultConfig {
        applicationId "com.grayawa.zipff"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 没有第三方依赖，避免 CI 里多一次依赖解析
}

dependencies {
}
