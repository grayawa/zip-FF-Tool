name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-test:
    name: Salvage engine self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run self-test
        run: sh tools/selftest.sh

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: engine-test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          NAME="zip-FF-Tool-${VER}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/zip-FF-Tool-latest.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-FF-Tool-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      # 滚动 Release：公开直链，不用登录也能下载
      # https://github.com/grayawa/zip-FF-Tool/releases/download/latest/zip-FF-Tool-latest.apk
      - name: Publish to rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建（debug）
          prerelease: true
          make_latest: false
          files: dist/*.apk
          body: |
            自动构建自 commit `${{ github.sha }}`。

            直接下载：`zip-FF-Tool-latest.apk`
