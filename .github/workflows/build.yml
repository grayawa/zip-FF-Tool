name: Build APK

on:
  push:
    branches: [ main, miuix ]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-test:
    name: Salvage engine self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install 7z (用于生成 AES 测试包)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Run self-test
        run: sh tools/selftest.sh

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: engine-test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      # 配了签名 Secrets → 打 release 包；否则退回 debug 包（也能装，只是用 debug key 签名）
      - name: Build
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            mkdir -p build
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > build/keystore.jks
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          echo "构建任务: $TASK"
          if gradle "$TASK" --no-daemon --stacktrace 2>&1 | tee build.log; then
            echo "构建成功"
          else
            grep -nE "error:|AAPT|Caused by|What went wrong|Execution failed" build.log \
              | tail -20 | while IFS= read -r line; do echo "::error::$line"; done
            tail -60 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Collect and verify APK
        if: success()
        run: |
          mkdir -p dist
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          fi
          cp "$APK" "dist/zip-FF-Tool-${VER}-${GITHUB_SHA::7}.apk"
          cp "$APK" "dist/zip-FF-Tool-latest.apk"
          echo "来源: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "dist/zip-FF-Tool-latest.apk" | head -6
          ls -lh dist

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zip-FF-Tool-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      # 滚动 Release：公开直链，不用登录也能下载
      # main → latest；miuix 分支 → miuix-preview
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/miuix')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'latest' || 'miuix-preview' }}
          name: ${{ github.ref == 'refs/heads/main' && '最新构建' || 'MiuiX 预览构建' }}
          prerelease: true
          make_latest: false
          files: dist/*.apk
          body: |
            自动构建自 commit `${{ github.sha }}`。

            直接下载：`zip-FF-Tool-latest.apk`
